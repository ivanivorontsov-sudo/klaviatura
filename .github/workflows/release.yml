name: release
on:
  push:
    branches: ['v*']
    tags: ['v*']
  create:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/assets/glide/**'
      - 'app/src/main/assets/gif_stickers/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
permissions: { contents: write }
concurrency:
  group: klaviatura-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    # Tag pushes are caused by the branch release job; do not start a duplicate build.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare release signing key
        shell: bash
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
        env: { KS_B64: "${{ secrets.KS_B64 }}" }
      - name: Unit tests (свайп-декодер)
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'ru.klaviatura.*'
      - name: Assemble signed release APK
        run: ./gradlew --no-daemon assembleRelease
        env: { KS_FILE: "${{ runner.temp }}/ks.jks", KS_PASS: "${{ secrets.KS_PASS }}", KS_ALIAS: klaviatura }
      - name: Release sanity (R8 kept JNI fields)
        run: python3 ci/check_jni_fields.py app/build/outputs/apk/release/*.apk libs-dl/sherpa-onnx-*.aar
      - name: Upload signed release-candidate APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Klaviatura-release-candidate
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Select release tag
        if: startsWith(github.ref, 'refs/heads/v')
        shell: bash
        run: echo "RELEASE_TAG=${GITHUB_REF_NAME%%-refresh*}" >> "$GITHUB_ENV"
      - name: Point release tag at the exact merged commit
        if: startsWith(github.ref, 'refs/heads/v')
        shell: bash
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
      - name: Recreate release with a fresh publication date and only the current APK
        if: startsWith(github.ref, 'refs/heads/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Клавиатура 1.5.19

          - Исправлен выбор русского языка свайпа при первом запуске; русская раскладка не подмешивает полный английский словарь.
          - Добавлены приоритетный словарь редких и длинных русских слов и 97 разговорных форм; ускорен ограниченный поиск длинных слов.
          - Улучшено распознавание свайпа между соседними клавишами: учитывается реальное продвижение пальца.
          - Локальные n-граммные подсказки учитывают язык предыдущего слова.
          - Голосовой ввод защищён от очистки поля пустыми промежуточными результатами распознавания.
          - Очередь скриншотов работает по FIFO; крестик скрывает очередь, не удаляя историю, а OCR-пропуск убирает только текущий снимок.
          - Текстовый буфер имеет приоритет над скриншотами; закрытие карточки текста возвращает очередь.
          - Карточка скриншота не занимает место трёх словесных подсказок.
          - Добавлены четыре оригинальные офлайн GIF-наклейки с лицензией CC0.
          - В настройках «О приложении» раздельно указаны исходный проект HeliBoard и автор кастомной версии Иван Воронцов.

          ### Основа и авторство
          - Исходный проект: https://github.com/HeliBorg/HeliBoard
          - Репозиторий кастомной версии: https://github.com/ivanivorontsov-sudo/klaviatura

          ### Предиктор
          Встроенные предсказания используют локальную статистическую n-граммную модель. MNN-Pocket-0.3B-RU в эту версию не интегрирован.

          ### Сборка
          Версия 1.5.19 (versionCode 41). APK подписан release-ключом; unit-тесты и проверка JNI после R8 пройдены.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/*.apk \
            --verify-tag \
            --title "Клавиатура $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest
      - name: Delete temporary release branch
        if: startsWith(github.ref, 'refs/heads/v')
        run: |
          git push origin --delete "$GITHUB_REF_NAME" || true
          git push origin --delete "v1.5.19" || true
          git push origin --delete "v1.5.19-refresh" || true
          git push origin --delete "v1.5.19-refresh2" || true
