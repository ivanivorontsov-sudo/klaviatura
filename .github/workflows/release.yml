name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: echo "${{ secrets.KS_B64 }}" | base64 -d > $RUNNER_TEMP/ks.jks
      - name: Unit tests (свайп-декодер)
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'ru.klaviatura.*'
      - run: ./gradlew --no-daemon assembleRelease
        env: { KS_FILE: "${{ runner.temp }}/ks.jks", KS_PASS: "${{ secrets.KS_PASS }}", KS_ALIAS: klaviatura, KLIPY_KEY: "${{ secrets.KLIPY_KEY }}" }
      - name: Release sanity (R8 kept JNI fields)
        run: python3 ci/check_jni_fields.py app/build/outputs/apk/release/*.apk libs-dl/sherpa-onnx-*.aar
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.4.3' || github.ref_name }}
          target_commitish: main
          name: Клавиатура 1.4.3
          body: |
            ## Клавиатура 1.4.3
            - Импорт всех новых скриншотов из серии, а не только одного снимка.
            - Копирование и SHA-256 обработка изображений выполняются вне UI-потока.
            - Закрытие предпросмотра относится к конкретному изображению, а не ко всем снимкам с одинаковым временем.
            - Предыдущие релизы сохраняются.
            - APK собирается с release-подписью; перед публикацией выполняются unit-тесты и проверка JNI.
          files: app/build/outputs/apk/release/*.apk
