name: Publish tested candidate 1.5.21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-tested-candidate-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish tested candidate 1.5.21'
    runs-on: ubuntu-latest
    steps:
      - name: Download the already-tested signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download 45799698810 \
            --repo "$GITHUB_REPOSITORY" \
            --name Klaviatura-release-candidate \
            --dir "$RUNNER_TEMP/candidate"
          APK="$(find "$RUNNER_TEMP/candidate" -maxdepth 2 -type f -name 'Klaviatura_1.5.21-release.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Create the official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Клавиатура 1.5.21

          - Исправлен выбор русского языка свайпа при первом запуске; русская раскладка не подмешивает полный английский словарь.
          - Добавлены приоритетный словарь редких и длинных русских слов и 97 разговорных форм; ускорен ограниченный поиск длинных слов.
          - Улучшено распознавание свайпа между соседними клавишами: учитывается реальное продвижение пальца.
          - Локальные n-граммные подсказки учитывают язык предыдущего слова.
          - Голосовой ввод защищён от очистки поля пустыми промежуточными результатами распознавания.
          - Очередь скриншотов работает по FIFO; крестик скрывает очередь, не удаляя историю, а OCR-пропуск убирает только текущий снимок.
          - Текстовый буфер имеет приоритет над скриншотами; закрытие карточки текста возвращает очередь.
          - Карточка скриншота не занимает место трёх словесных подсказок.
          - Добавлены четыре оригинальные офлайн GIF-наклейки с лицензией CC0.
          - В настройках «О приложении» раздельно указаны исходный проект HeliBoard и автор кастомной версии Иван Воронцов.
          - Карточка скопированного текста вынесена в отдельную область и не исчезает при обновлении словарных подсказок.
          - Исправлена стартовая прокрутка «Голосовых инструментов».
          - Исправлены малоконтрастные подписи аудиозаписей и тесная раскладка кнопок: действия показаны в две строки.
          - Усилена обработка новых скриншотов: повторный импорт после уведомлений MediaStore, без лимита в 100 последних изображений и с безопасным временем файла.

          ### Основа и авторство
          - Исходный проект: https://github.com/HeliBorg/HeliBoard
          - Репозиторий кастомной версии: https://github.com/ivanivorontsov-sudo/klaviatura

          ### Предиктор
          Встроенные предсказания используют локальную статистическую n-граммную модель. MNN-Pocket-0.3B-RU в эту версию не интегрирован.

          ### Сборка
          Версия 1.5.21 (versionCode 43). APK подписан release-ключом; unit-тесты и проверка JNI после R8 пройдены.
          EOF

          if gh release view v1.5.21 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.5.21 --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create v1.5.21 "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Клавиатура v1.5.21" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target 7f30bc60ec0b9cf7a3465a880bb38da99eb2f0ec \
            --latest

      - name: Remove this one-off publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-tested-candidate-once.yml
          git commit -m "Remove one-time 1.5.21 publisher"
          git push origin HEAD:main
