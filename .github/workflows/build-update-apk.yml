name: Build signed update APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - '.github/workflows/build-update-apk.yml'
  workflow_dispatch:

concurrency:
  group: klaviatura-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'ru.klaviatura.*'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore release signing key
        run: echo "${{ secrets.KS_B64 }}" | base64 -d > "$RUNNER_TEMP/ks.jks"

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace
        env:
          KS_FILE: ${{ runner.temp }}/ks.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: klaviatura
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}

      - name: Check JNI fields
        run: python3 ci/check_jni_fields.py app/build/outputs/apk/release/*.apk libs-dl/sherpa-onnx-*.aar

      - name: Verify APK signature
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: Klaviatura-update-v1.5.18
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.18
          target_commitish: main
          name: Клавиатура v1.5.18
          body: |
            ## Клавиатура v1.5.18
            - Добавлена отдельная закрепляемая кнопка диктофона в панели инструментов; старые закреплённые панели автоматически мигрируют и получают новую кнопку.
            - Долгое нажатие на карточку скриншота/фото запускает локальный OCR: вставляет текст и JSON-структуру с координатами строк и слов; обычное нажатие по-прежнему вставляет изображение.
            - Русская и английская OCR-модели загружаются один раз (~8 МБ); распознавание выполняется на устройстве, без отправки изображений в сеть.
            - Во время голосового ввода появились команды редактирования: исправление фразы, замена слова по номеру, удаление слова/фрагмента и переписывание всего поля.
            - Команды обрабатываются локально и не отправляют сообщение; нераспознанная обычная речь продолжает вставляться как текст.
            - Добавлена расшифровка выбранных аудиофайлов через системный выбор файлов и локальный Vosk; распознанный текст можно проверить и отредактировать перед ручной вставкой.
            - Расшифровка не отправляет аудио в сеть и не отправляет сообщение автоматически.
            - Встроенный диктофон сохраняет аудио локально и поддерживает отдельную отправку файла через системное меню.
            - Улучшены HTTPS-редиректы, тайм-ауты и диагностика ошибок скачивания моделей.
            - Добавлен словарь технических терминов и подсказки распознавателю Android.

            - Второй микрофон перенесён из строки подсказок в панель инструментов; долгое нажатие начинает запись прямо на клавиатуре.
            - Во время записи доступны таймер, пауза, продолжение, завершение и отмена; после записи — обрезка, отправка и удаление.
            - Добавлена библиотека аудиозаписей клавиатуры с воспроизведением, локальной расшифровкой, обрезкой и отправкой.
            - Смешанный русский/английский голосовой ввод выбирает язык по языковым признакам текста и confidence; на Android 14+ системному распознавателю запрашивается автоматическое переключение языков.
            - Добавлен встроенный диктофон: долгое нажатие на микрофон открывает запись, прослушивание и отправку локального аудиофайла через системное меню приложений.
            - Голосовой ввод получил локальный словарь технических терминов и контекстные подсказки системному распознавателю Android 13+ (РКН, VPN, БМП, БЦЖ, API, GPS, USB и др.).
            - Расширен русский словарь свайп-ввода.
            - Аббревиатура «ИИ» защищена от автозамены на «им» и сохраняет заглавные буквы в голосовом вводе и свайп-подсказках.
            - Голосовой ввод исправляет «вот/вод» на «ввод» только в явном контексте «голосовой …».
            - Добавлен менеджер пакетов: обновление офлайн-словарей свайпа и установка дополнительных словарей.
            - Добавлены 21 пакет синтаксиса программирования: Python, JavaScript, TypeScript, Java, Kotlin, C/C++, C#, Go, Rust, Swift, PHP, Ruby, SQL, HTML, CSS, Bash, Lua, Dart, R и «Понятный».
            - Выбранный синтаксис применяется к голосовому вводу, включая системный распознаватель Google; программный режим голоса включается отдельно.
            - Программные раскладки удалены из списка раскладок по умолчанию.
            - Персональные подсказки следующего слова учитывают два предыдущих слова (триграммы) и сохраняются локально.
            - Скачанные пакеты хранятся на устройстве; тексты пользователя не отправляются на сервер пакетов.
            - APK собран с release-подписью; перед публикацией выполняются unit-тесты и проверка JNI/подписи.
          files: app/build/outputs/apk/release/*.apk

